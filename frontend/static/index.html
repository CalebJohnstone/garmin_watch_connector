<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="header-inner">
            <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" fill="currentColor"/>
            </svg>
            <h1>Fitness Dashboard</h1>
        </div>
    </header>

    <main>
        <!-- Steps Section -->
        <section class="section">
            <div class="section-header">
                <h2>Daily Steps</h2>
                <button id="sync-steps-btn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                    Sync Steps
                </button>
            </div>
            <div id="steps-stats"></div>
            <div id="steps-chart"></div>
        </section>

        <!-- Activities Section -->
        <section class="section">
            <div class="section-header">
                <h2>Running Activities</h2>
                <button id="sync-activities-btn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                    Sync Activities
                </button>
            </div>
            <div id="activities-list" class="cards-grid"></div>
        </section>
    </main>

    <script type="module">
        import init from './fitness_frontend.js';
        await init();
    </script>
</body>
</html>
